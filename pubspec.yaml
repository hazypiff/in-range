name: in_range
description: "In Range - Real Encounters. Real Connections. (Flutter + Supabase)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & State (core to Phase 0)
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1

  # BLE + Location (per 2026 research - flutter_blue_plus preferred)
  #
  # PINNED, DO NOT BUMP. 2.x relicensed: LICENSE.md Section 1.3 requires a paid
  # commercial licence for "any for-profit organization ... regardless of how the
  # Software was obtained", Section 3 extends that to "commercial use by
  # individuals", and 3.3 counts development and testing as commercial use. The
  # obligation is on ALL use, not on connect() — the `License` enum on connect()
  # is only where you declare a tier. So writing our own GATT reader
  # (GattTokenReader.kt) and our own iOS carrier never bought an exemption.
  #
  # NOTICE.md: the old BSD-3 terms apply to "all releases ... up to and including
  # version 1.36.8 ... which are irrevocable". Verified against the 1.36.8
  # artifact: LICENSE is plain BSD-3 (Copyright 2017-2024 DeMarco, Popovic,
  # Weinberger, Clark), zero occurrences of "commercial" or "for-profit", and all
  # nine APIs we use are present (AndroidScanMode, adapterName, getPhySupport,
  # MsdFilter, withMsd, withServices, continuousUpdates, androidLegacy,
  # adapterStateNow). It also pins flutter_blue_plus_android 7.0.4, which unlike
  # 9.x ships no license_ping.gradle — so every `flutter build` stops POSTing our
  # package name, app name and version to a third party's Apps Script.
  #
  # Bumping to 2.x is a licensing decision, not a dependency update.
  flutter_blue_plus: 1.36.8
  flutter_ble_peripheral: ^2.1.1   # For advertising ephemeral tokens
  geolocator: ^13.0.2
  geocoding: ^4.0.0
  permission_handler: ^11.3.1
  flutter_dotenv: ^5.2.1

  # Foreground service for reliable background BLE/GPS (required on modern Android)
  flutter_background_service: ^5.0.0
  flutter_background_service_android: ^6.0.0

  # Crypto + Utils
  crypto: ^3.0.6
  uuid: ^4.5.1
  shared_preferences: ^2.5.5
  path: ^1.9.1
  image: ^4.5.4
  sqflite: ^2.4.3
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.0.1
  url_launcher: ^6.3.1   # Policy documents must be tappable (Apple 5.1.1)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1 # deterministic Timer control for ClaimManager retry tests

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0   # If using json models

flutter:
  uses-material-design: true

  assets:
    # Required: reproducible CI/clone builds. Optional local secrets via .env
    # are loaded when present in the asset bundle (gitignored — add only for
    # device builds: flutter build with a copied .env, or use --dart-define).
    - .env.example
