name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-build.yml'
  # Audit F1 (2026-07-31): PR-class Swift work previously got no automatic
  # compile gate — this workflow only ran on push-to-main or by hand.
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-build.yml'

jobs:
  # Audit F2 (2026-07-31): RunnerTests never executed in CI — every native
  # "N/N green" claim rested on one Mac simulator run. This job is the
  # third-party corroboration: the full native bundle on a clean runner.
  # Panel B5: BOTH schemes now run here (Runner + diag flavor assertions),
  # serially, to also cover the diag-side #if INRANGE_DIAG branches.
  test-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get + generate iOS config
        run: |
          flutter pub get
          flutter build ios --config-only --debug --no-codesign

      - name: Pod install
        run: cd ios && pod install

      - name: H-DIAG-2 release isolation (build-settings check)
        run: bash scripts/check_release_isolation.sh

      - name: Pick a simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9][^(]*' | head -1 | sed 's/ *$//')
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Simulator: $DEVICE"

      - name: RunnerTests — Runner scheme (production side)
        run: |
          cd ios
          set -o pipefail
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -resultBundlePath RunnerResult.xcresult \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -only-testing:RunnerTests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild-runner.log | grep -E "Test [Cc]ase|Executed|TEST" || true
          # Floor PINNED to the authoritative discovered count (was 40) so a large
          # discovery regression can't slip under a low floor (panel supplemental).
          bash ../scripts/assert_native_tests.sh xcodebuild-runner.log 55

      - name: RunnerTests — diag scheme (diagnostic side, #if INRANGE_DIAG)
        run: |
          cd ios
          set -o pipefail
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme diag \
            -configuration Debug-diag \
            -resultBundlePath DiagResult.xcresult \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -only-testing:RunnerTests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild-diag.log | grep -E "Test [Cc]ase|Executed|TEST" || true
          # The diag scheme must run the named A5 test (no environment skip).
          # Floor PINNED to the authoritative discovered count (was 70).
          bash ../scripts/assert_native_tests.sh xcodebuild-diag.log 99 \
            testHandleUsesProvisionedRunSecret

      - name: Record authoritative native test counts + log hashes
        if: always()
        run: |
          cd ios
          {
            echo "### Native test evidence (exact SHA ${GITHUB_SHA})"
            for f in xcodebuild-runner.log xcodebuild-diag.log; do
              [ -f "$f" ] || continue
              line="$(grep -Eo 'Executed [0-9]+ tests?, with [0-9]+ failures \([0-9]+ unexpected\)' "$f" | tail -1)"
              echo "- $f: ${line:-'(no summary)'} sha256=$(shasum -a 256 "$f" | cut -d' ' -f1)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-tests-logs
          path: |
            ios/xcodebuild-runner.log
            ios/xcodebuild-diag.log
          retention-days: 14

  # Panel B5: the final-binary negative/positive controls are now an EXECUTABLE
  # CI gate, not local scaffolding. Production must carry no diagnostic code /
  # run-secret env read; the diag build must, so the control is proven to fire.
  isolation-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Final-binary isolation (negative + positive controls)
        # Real production + diag release builds, discriminated on diagnostic
        # symbols AND the run-secret env string. .env is optional in CI.
        run: bash scripts/check_final_binary_isolation.sh

  build-ios:
    # Panel B5: the release artifact is produced ONLY when both the native test
    # bundle (both schemes) and the isolation controls pass — no more uploading
    # an IPA that never proved isolation or green tests.
    needs: [test-ios, isolation-ios]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (release, unsigned)
        # Unsigned compile-check + installable-after-resign artifact.
        # Secrets come from repo Actions secrets when set; falls back to
        # .env.example placeholders (app then runs in local/offline mode).
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            --dart-define=INRANGE_HMAC_SECRET="${{ secrets.INRANGE_HMAC_SECRET }}" \
            --dart-define=INRANGE_USER_ID_SECRET="${{ secrets.INRANGE_USER_ID_SECRET }}" \
            --dart-define=ENCOUNTER_REVEAL_DELAY_HOURS="0"

      - name: Package Runner.app
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qry InRange-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: InRange-unsigned-ipa
          path: build/ios/iphoneos/InRange-unsigned.ipa
          retention-days: 14
