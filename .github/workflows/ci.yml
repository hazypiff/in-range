name: CI

# Runs on every push and PR, not just main, and not just when ios/** changes.
#
# Why this exists: until 2026-07-25 nothing in .github/ ran `flutter test` or
# `flutter analyze`. The 158-test suite executed only when a human remembered,
# which is how security_regression.sql sat dead for 37 migrations and how two
# separate rounds were reported green while the iOS build was broken. A test
# that does not gate a merge is a test that protects nothing.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

# A newer push to the same ref makes the older run irrelevant — cancel it
# rather than paying for both. Never cancel on main: those runs are the record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dart:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Formatting is deliberately NOT enforced here. The tree has never been
      # `dart format`-clean, so adding it now would produce a red build that
      # says nothing about correctness and teaches everyone to ignore CI.
      - name: Analyze
        run: flutter analyze

      - name: Test
        # No --coverage: it roughly doubles runtime and nothing consumes the
        # lcov output yet. Total line coverage was 22.3% on 2026-07-25 and the
        # 1,580-line BeaconService sat at 7.0%; publishing that number is worth
        # doing, but as a deliberate task, not as a side effect of this job.
        run: flutter test --reporter expanded

  android-unit:
    name: android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # AdvertParser exists because flutter_blue_plus merges every manufacturer AD
    # into one blob and labels it with the FIRST company id, which can silently
    # break backgrounded-iPhone detection. Its 45 tests are mutation-checked
    # (three mutations to the parser fail nine of them), but this job never ran
    # Gradle, so until now they executed only when someone remembered — the exact
    # failure mode the header comment above describes.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # `flutter pub get` writes the generated Gradle plugin files that
      # android/ needs; without it the Gradle build cannot resolve the Flutter
      # plugin loader and fails before reaching any test.
      - name: Pub get
        run: flutter pub get

      # `./gradlew` is NOT in the repo — android/.gitignore ignores both
      # `/gradlew` and `gradle-wrapper.jar` (Flutter's template default), so a
      # fresh checkout has no wrapper and `./gradlew` fails with exit 127. Rather
      # than change that ignore policy, install the exact version the wrapper
      # pins and drive Gradle directly.
      - name: Read pinned Gradle version
        id: gradlever
        run: |
          v=$(sed -n 's#.*distributions/gradle-\([0-9.]*\)-.*#\1#p' \
              android/gradle/wrapper/gradle-wrapper.properties)
          test -n "$v" || { echo "could not parse gradle version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Gradle $v"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradlever.outputs.version }}

      - name: Gradle unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
